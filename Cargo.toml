[workspace]
resolver = "3"
members = ["tools/*", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
rintawa-artifacts = { git = "https://github.com/martrtr/rintawa.git", rev = "4bbb2e453208f14dcb9e9a524266aaf6a58dfbff" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
