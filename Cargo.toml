[workspace]
resolver = "3"
members = ["tools/*", "crates/*", "packages/web-runtime", "packages/chat", "packages/character", "packages/narrator", "packages/ai-provider"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
rintawa-artifacts = { git = "https://github.com/martrtr/rintawa.git", rev = "b997e98e489cf6eee27e9a21a249a666d7a5df61" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
