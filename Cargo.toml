[workspace]
resolver = "3"
members = [
    "tools/registry-tool",
    "tools/componentize",
    "packages/web-runtime",
    "packages/package-manager",
    "packages/character-library",
    "packages/world-manager",
    "packages/world-manager/runtime",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
rintawa-artifacts = { git = "https://github.com/martrtr/rintawa.git", rev = "820286a" }
rintawa-sdk = { git = "https://github.com/martrtr/rintawa.git", rev = "820286a" }
rintawa-ui-runtime = { git = "https://github.com/martrtr/rintawa.git", rev = "820286a" }
