[workspace]
resolver = "3"
members = ["tools/registry-tool"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
rintawa-artifacts = { git = "https://github.com/martrtr/rintawa.git", rev = "e2698b9f206fe86b61d019b2d7e115a6e29b0c28" }
