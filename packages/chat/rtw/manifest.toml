id = "rintawa.rtwkit.chat"
name = "rtwKit Chat"
version = "0.0.3"
sdk = "^0.0"

[[components]]
id = "runtime"
kind = "runtime"
target = "rintawa.runtime.wasm-component@1"
entry = "runtime.wasm"
required = true

[components.permissions]
runtime = [
    "background-task",
    "world-command-submit",
    "world-projection-read",
]
