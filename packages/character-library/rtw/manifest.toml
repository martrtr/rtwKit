id = "rintawa.rtwkit.character-library"
name = "rtwKit Character Library"
version = "0.0.3"
sdk = "^0.0"

[[components]]
id = "content-handler"
kind = "runtime"
target = "rintawa.runtime.wasm-component@1"
entry = "content-handler.wasm"
required = true

[[components]]
id = "runtime"
kind = "runtime"
target = "rintawa.runtime.wasm-component@1"
entry = "runtime.wasm"
required = true

[components.permissions]
runtime = [
    "user-content-read",
    "user-content-write",
    "user-resource-read",
    "asset-import",
    "background-task",
    "world-session-read",
    "world-session-write",
    "world-command-submit",
    "composition-read",
]
