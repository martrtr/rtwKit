id = "rintawa.rtwkit.ai-provider"
name = "rtwKit AI Provider"
version = "0.0.1"
sdk = "^0.0"

[[components]]
id = "runtime"
kind = "runtime"
target = "rintawa.runtime.wasm-component@1"
entry = "runtime.wasm"
required = true

[components.permissions]
runtime = ["http-request", "background-task"]
secret-read = ["ai.api_keys.openai"]
