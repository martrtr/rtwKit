id = "rintawa.rtwkit.web-ui"
name = "Rintawa"
version = "0.1.0"
sdk = "^0.0"
[[components]]
id = "shell"
kind = "ui"
target = "rintawa.runtime.web-bundle@2"
entry = "web-bundle.toml"
[components.permissions]
runtime = ["background-task", "world-session-read", "world-session-write", "runtime-policy-write", "secret-manage"]

[[components]]
id = "home"
kind = "ui"
target = "rintawa.runtime.web-bundle@2"
entry = "home-bundle.toml"
[components.permissions]
runtime = ["background-task", "world-session-read"]
