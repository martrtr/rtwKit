name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check tracked local files
        run: |
          if git ls-files -- .vscode/ .idea/ | grep -q .; then
            echo "Local editor and planning files must not be tracked." >&2
            exit 1
          fi
      - name: Scan repository for secrets
        run: |
          bash scripts/test-secret-scan.sh
          bash scripts/scan-secrets.sh
      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install browser build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check libraries, browser runtime and packages
        run: bash scripts/check.sh
