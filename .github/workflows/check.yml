name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install browser build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check libraries, browser runtime and packages
        run: bash scripts/check.sh
