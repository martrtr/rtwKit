name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        run: |
          bash scripts/test-secret-scan.sh
          bash scripts/scan-secrets.sh
      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.98.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Web UI dependencies
        working-directory: packages/web-ui
        run: npm ci
      - name: Check Web UI
        working-directory: packages/web-ui
        run: |
          npm run typecheck
          npm test
          npm run build:rtw
      - name: Build Web Runtime RTW layout
        working-directory: packages/web-runtime
        run: ./build.sh
      - name: Validate repository metadata
        run: cargo run --locked -p rtwkit-registry-tool -- validate-repository .
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Docs
        run: cargo doc --locked --workspace --all-features --no-deps
